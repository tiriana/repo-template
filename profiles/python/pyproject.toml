[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "your-project-name"
version = "0.0.0"
description = ""
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "your-github-owner" }]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
]

[project.urls]
Homepage = "https://github.com/your-github-owner/your-project-name"
Issues = "https://github.com/your-github-owner/your-project-name/issues"

[project.optional-dependencies]
dev = ["pytest>=9", "ruff>=0.17"]

[tool.hatch.build.targets.wheel]
packages = ["src/your_project_name"]

[tool.ruff]
line-length = 88
src = ["src", "tests"]
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"
